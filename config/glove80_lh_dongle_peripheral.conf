# Extra Kconfig fragment (not part of glove80_lh_defconfig on purpose):
# builds the Glove80 left half as a plain BLE split peripheral instead of
# the central, for use together with the glove80_dongle shield.
#
# Apply it only when building the dongle-mode LH firmware, e.g.:
#   west build -b glove80_lh -- -DEXTRA_CONF_FILE=glove80_lh_dongle_peripheral.conf
# or via the `kconfig` override on the `zmk` derivation in default.nix.
#
# Do not merge this into glove80_lh_defconfig - that would make LH a
# peripheral even when no dongle is present, breaking the normal build.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# glove80_lh.dts unconditionally defines the `underglow_indicators` devicetree
# node (it's real hardware on the LH half), so src/rgb_underglow.c always
# compiles its status-rendering code for this board. That code normally calls
# central-only APIs (zmk_keymap_layer_active, zmk_ble_active_profile_index,
# etc.) that aren't compiled in when CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n (see the
# `if ((NOT CONFIG_ZMK_SPLIT) OR CONFIG_ZMK_SPLIT_ROLE_CENTRAL)` guard in
# app/CMakeLists.txt). rgb_underglow.c handles this itself: everything except
# LH's own battery reading is wrapped in `#if IS_ENABLED(CONFIG_ZMK_SPLIT_ROLE_CENTRAL)`,
# so as a peripheral LH just renders its own battery level and nothing else -
# no extra Kconfig needed here for that. (We previously tried relaying
# layer/BLE/USB/peer-battery status down from the dongle over a custom BLE
# characteristic so LH could show the full display; that relay never
# reliably delivered data and was removed in favor of this simpler
# own-battery-only approach, which needs no cross-device communication at
# all.) CONFIG_ZMK_RGB_UNDERGLOW stays at its normal glove80_lh_defconfig
# default (y).
